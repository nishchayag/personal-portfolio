name: Refresh project screenshots

on:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: node scripts/capture-screenshots.mjs

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain public/work)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/work
            git commit -m "chore(screenshots): refresh project screenshots"
            git push origin HEAD:main
          else
            echo "No screenshot changes."
          fi

      - name: Keep dev in sync
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD; then
            git push origin HEAD:dev
          else
            echo "::notice::origin/dev has diverged from main — merge main into dev manually (git merge main)."
          fi
